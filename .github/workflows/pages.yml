# Build the collection page and publish it to GitHub Pages.
#
# The page is a hundred kilobytes of HTML over fifteen gigabytes of pictures and
# reports, and only the first of those belongs in a repository. So the weight stays
# on the storage - PP_DATA_URL below - and this builds the light half against it:
# the page, the viewer, the banner, the taxonomy. About 46 MB.
#
# Two inputs have to be in the repository for that, both written by `collect site`
# and both small enough to keep:
#
#   site/collection.json   the expedition table, 90 KB - counts, depths, dates
#   site/tiles-index.json  the taxonomy tree and the counts under the rings, 632 KB
#   site/assets/           the colour banner and the drawing, 2 MB
#
# The tile index is committed rather than fetched because a runner cannot reach the
# storage: DESY answers this network in under half a second and times out from
# GitHub's, which is a firewall on datacentre ranges rather than an outage. The
# reader's browser fetches the pictures at read time over the same path and is fine.
# Everything else is code.
name: page

on:
  push:
    branches: [main]
    paths:
      - 'src/pixel_patrol_deepsea/page/**'
      - 'src/pixel_patrol_deepsea/viewer/**'
      - 'src/pixel_patrol_deepsea/landing.py'
      - 'src/pixel_patrol_deepsea/catalogue_page.py'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

env:
  PP_DATA_URL: https://hifis-storage.desy.de/Helmholtz/HIP/collaborations/PixelPatrolDeepSea/

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the framework this extends
        uses: actions/checkout@v4
        with:
          repository: ida-mdc/pixel-patrol
          path: pixel-patrol

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pixel-patrol/viewer/package-lock.json

      # The viewer is a Vite app, and `viewer_dist` - the built copy that
      # pixel-patrol-base ships and `build_viewer` copies out - is gitignored in
      # that repository because it is build output. A fresh clone has none, so it
      # is built here. Seven seconds.
      - name: Build the viewer
        working-directory: pixel-patrol/viewer
        run: |
          npm ci
          npm run build

      # `--no-deps` on this package on purpose: its dependencies include torch,
      # which is most of a gigabyte and is for reading footage. A page build reads
      # no footage. What it does need comes with pixel-patrol-base.
      #
      # pixel-patrol-geospatial is here for one reason: it is the other package
      # that declares a `pixel_patrol.viewer_extensions` entry point, and without
      # it installed the viewer is built without the map widget - silently, which
      # is how the collection went a fortnight with no map on it.
      - name: Install
        run: |
          pip install ./pixel-patrol/packages/pixel-patrol-base \
                      ./pixel-patrol/packages/pixel-patrol-geospatial
          pip install -e . --no-deps
          pip install pyyaml pillow

      # Whether this runner can see the storage at all, which it usually cannot.
      # Reported and never fatal: nothing in the build needs it, the check is here
      # so a genuine outage is visible in the log rather than only to readers.
      - name: Ask the storage how it is
        continue-on-error: true
        run: |
          code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' \
                   "${PP_DATA_URL}tiles/index.json" || echo "unreachable")
          echo "${PP_DATA_URL}tiles/index.json -> $code"

      - name: Build
        run: |
          mkdir -p build/tiles
          cp site/collection.json build/
          cp -r site/assets build/
          # The tile index is read to write the page and not afterwards, so it is
          # put where the builder looks and taken out of the artifact again.
          cp site/tiles-index.json build/tiles/index.json
          python -m pixel_patrol_deepsea.collect page build --data-url "$PP_DATA_URL"
          rm -rf build/tiles

      # A viewer missing an extension still builds, still serves and still looks
      # fine - it is just missing a widget. So it is counted rather than trusted.
      - name: Say what was built
        run: |
          du -sh build
          grep -o 'window.PP_TILES = "[^"]*"' build/index.html
          test -f build/viewer/extensions/*/plugin_map_viewer.js \
            || { echo "::error::the viewer was built without the map widget"; exit 1; }
          python - <<'PY'
          import json, pathlib, sys
          listed = json.loads(pathlib.Path("build/viewer/pp_extension_urls.json").read_text())
          print(f"{len(listed)} viewer extensions:", *listed, sep="\n  ")
          sys.exit(0 if len(listed) >= 3 else 1)
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
