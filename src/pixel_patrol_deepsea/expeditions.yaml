# ── the same place, ten years apart ───────────────────────────────────────────
#
# Everything above is an expedition: a ship goes somewhere once, and whatever it
# filmed is the only footage of that spot there will ever be. This is the
# opposite. CAMHDA301 is a high-definition camera bolted to the seafloor in the
# ASHES hydrothermal vent field on Axial Seamount, 1542 m down, and it has filmed
# fourteen minutes every three hours since 2015.
#
# So it can answer a question no cruise can: what changed. These five recordings
# are the same camera on the same day of the year at the same hour, two years
# apart each time - 2016, 2018, 2022, 2024, 2026. Merge their reports and the
# comparison is a filter on one column. (2020 has no recording for that date.)
#
# Position comes from the observatory's own deployment register rather than being
# written down here, because the camera is recovered and reinstalled and each
# deployment has its own coordinates and depth: the 2016 recording resolves to
# deployment 3 at 1543 m and the 2026 one to a later deployment a few metres away.
- id: OOI_AXIAL_CAMHD
  link: https://interactiveoceans.washington.edu/instruments/high-definition-video-camera/
  name: Axial Seamount ASHES vent field, 2016-2026
  archive: Ocean Observatories Initiative Regional Cabled Array
  vessel: Fixed camera CAMHDA301, cabled to shore
  date: 2016/2026
  location:
    kind: ooi-deployment
    reference: RS03ASHS-PN03B-06-CAMHDA301
  notes: >-
    A high-definition camera in the ASHES hydrothermal vent field on Axial
    Seamount, 1542 m deep on the Juan de Fuca Ridge. It runs a scripted pan and
    zoom over the sulphide chimneys and their tubeworm cover every three hours.
    Five recordings a decade apart, same day of year, same hour.
  videos:
    - https://rawdata.oceanobservatories.org/files/RS03ASHS/PN03B/CAMHDA301/2016/08/15/CAMHDA301-20160815T030000Z.mp4
    - https://rawdata.oceanobservatories.org/files/RS03ASHS/PN03B/CAMHDA301/2018/08/15/CAMHDA301-20180815T031500.mp4
    - https://rawdata.oceanobservatories.org/files/RS03ASHS/PN03B/CAMHDA301/2022/08/15/CAMHDA301-20220815T031500.mp4
    - https://rawdata.oceanobservatories.org/files/RS03ASHS/PN03B/CAMHDA301/2024/08/15/CAMHDA301-20240815T031500.mp4
    - https://rawdata.oceanobservatories.org/files/RS03ASHS/PN03B/CAMHDA301/2026/08/15/CAMHDA301-20260815T031500.mp4

