# Expeditions we collect from. Adding one here is the whole of "collect this too":
# the scheduler lists it, notices which of its videos have no parquet yet, and
# processes those. Nothing is downloaded - the recordings are read where they are.
#
#   id        short, stable, used as the parquet name
#   listing   a directory index to walk
#   depth     directory levels between the listing and the videos
#   pattern   which files in the leaf directory are the recordings
#   location  how to find out where the footage was filmed - a recipe, not
#             coordinates, because the answer differs per dive and per deployment
#             and the archive is the one that knows it. See `locations`.

- id: EX2107
  name: Windows to the Deep 2021
  archive: NOAA Ocean Exploration
  vessel: NOAA Ship Okeanos Explorer, ROV Deep Discoverer
  date: 2021-10
  listing: https://www.ncei.noaa.gov/data/oceans/oer/video/EX2107/Video/
  depth: 2
  pattern: "*ROVHD_Low.mp4"
  location:
    kind: noaa-dive
    data: https://oer.hpc.msstate.edu/okeanos/ex2107/
  notes: Deep-sea coral and sponge habitats off the US southeast; 14 dives.

- id: EX1903L2
  name: Windows to the Deep 2019
  archive: NOAA Ocean Exploration
  vessel: NOAA Ship Okeanos Explorer, ROV Deep Discoverer
  date: 2019-06
  listing: https://www.ncei.noaa.gov/data/oceans/oer/video/EX1903L2/Video/
  depth: 2
  pattern: "*ROVHD_Low.mp4"
  location:
    kind: noaa-dive
    data: https://oer.hpc.msstate.edu/okeanos/ex1903l2/
  notes: >-
    19 dives on the Blake Plateau and Blake Escarpment, the deepest at 3498 m. The
    earlier half of the only repeat visit in this catalogue - see EX2107.

- id: EX1605L1
  name: Deepwater Exploration of the Marianas
  archive: NOAA Ocean Exploration
  vessel: NOAA Ship Okeanos Explorer, ROV Deep Discoverer
  date: 2016-04
  listing: https://www.ncei.noaa.gov/data/oceans/oer/video/EX1605L1/Video/
  depth: 2
  # This cruise published themed clips rather than one continuous tape, so the
  # plain "*ROVHD_Low.mp4" that works for the others matched nothing at all here.
  # The theme is in the name - ROVHD_FSH_Low is the fish, ROVHD_COR_Low the coral -
  # which makes it a free label to check the detector's naming against.
  pattern: "*ROVHD*_Low.mp4"
  location:
    kind: noaa-dive
    data: https://oer.hpc.msstate.edu/okeanos/ex1605l1/
  notes: >-
    Mariana Trench Marine National Monument; hydrothermal and seamount sites.
    Nineteen dives, and dive 3 worked at 4996 m - the deepest footage in this
    catalogue, which is not something the collection knew until its dive reports
    could be read.

# The one set here with per-frame ground truth: every animal in every frame is
# boxed, in MOT format, in a gt.txt for each recording. That makes it the only
# expedition whose numbers can be checked rather than believed, which is why it is
# worth processing first and looking at hardest.
#
# All eleven published sequences carry ground truth - checked against the archive,
# not assumed. Seven keep it beside the recording and four in the `gt/`
# subdirectory the MOT format specifies, so both places are looked in (see
# `catalogue.truth_urls`). What decides what is listed here is size, not truth:
# the six HD sequences are all here, and the five 4K ones are 2.2 GB each and left
# out for now. Two of those five, MD_CAN and MD_CLS, are the same footage under
# two names - identical video and byte-identical annotations - so they would be
# one sequence, not two.
- id: DSMOT
  name: MBARI DeepSea-MOT
  archive: MBARI, via Hugging Face
  vessel: MBARI ROVs Doc Ricketts and Ventana
  date: "2023"
  truth: gt.txt
  notes: >-
    A multi-object-tracking benchmark for deep-sea video. B* sequences are benthic
    and M* midwater, which matters: a midwater detector scores nothing on the
    benthic ones. Recorded at 1920x1080 and 25 to 60 frames a second - a different
    camera from the 640x360 proxies every NOAA cruise here is read at, which is
    the standing caveat on every number scored against it.
  videos:
    - https://huggingface.co/datasets/MBARI-org/DeepSea-MOT/resolve/main/data/MWD/MWD.mov
    - https://huggingface.co/datasets/MBARI-org/DeepSea-MOT/resolve/main/data/MWS/MWS.mov
    - https://huggingface.co/datasets/MBARI-org/DeepSea-MOT/resolve/main/data/MD_FLN/MD_FLN.mp4
    # 10 MB and 374 annotated boxes, with its ground truth in `gt/` rather than
    # beside it - which is the only reason it used to look like it had none.
    - https://huggingface.co/datasets/MBARI-org/DeepSea-MOT/resolve/main/data/MD_BTL/MD_BTL.mp4
    - https://huggingface.co/datasets/MBARI-org/DeepSea-MOT/resolve/main/data/BD/BD.mov
    - https://huggingface.co/datasets/MBARI-org/DeepSea-MOT/resolve/main/data/BS/BS.mov

# ── deeper, and further apart ──────────────────────────────────────────────────
#
# Four more Okeanos Explorer cruises, chosen for depth and for being nowhere near
# each other: the Central Pacific, the Gulf of Alaska, the Mid-Atlantic Ridge and
# the US West Coast. Depths below are what each dive's own report states - read
# with `locations.noaa_dive_summary`, which costs one ranged read of a text file,
# not a download of the dive.
#
# All four publish a 1 Hz vehicle track, so their footage gets a position and a
# depth per slice rather than one per dive.
#
# That used to be written down here as the reason to prefer them over the older
# cruises. It was wrong: EX1903L2 and EX1605L1 publish the same 1 Hz track and the
# same dive reports, in an older notation - "Max. depth" and degrees-and-minutes
# rather than "Max Vehicle Depth" and decimal degrees - that this package could
# not read, so they arrived with no depth and no on-bottom window and quietly had
# their descent footage analysed. `locations` reads both notations now. What is
# actually newer about these four is the footage, not the navigation.

- id: EX2503
  name: "Beyond the Blue: Papahanaumokuakea 2025"
  archive: NOAA Ocean Exploration
  vessel: NOAA Ship Okeanos Explorer, ROV Deep Discoverer
  date: 2025-04
  listing: https://www.ncei.noaa.gov/data/oceans/oer/video/EX2503/Video/
  depth: 2
  pattern: "*ROVHD_Low.mp4"
  location:
    kind: noaa-dive
    data: https://oer.hpc.msstate.edu/okeanos/ex2503/
  notes: >-
    Seamounts and abyssal plain in and around Papahanaumokuakea, Central Pacific.
