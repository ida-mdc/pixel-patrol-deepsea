# Expeditions we collect from. Adding one here is the whole of "collect this too":
# the scheduler lists it, notices which of its videos have no parquet yet, and
# processes those. Nothing is downloaded - the recordings are read where they are.
#
#   id        short, stable, used as the parquet name
#   listing   a directory index to walk
#   depth     directory levels between the listing and the videos
#   pattern   which files in the leaf directory are the recordings
#   location  how to find out where the footage was filmed - a recipe, not
#             coordinates, because the answer differs per dive and per deployment
#             and the archive is the one that knows it. See `locations`.

- id: EX2107
  link: https://archive.oceanexplorer.noaa.gov/okeanos/explorations/ex2107/welcome.html
  name: Windows to the Deep 2021
  archive: NOAA Ocean Exploration
  vessel: NOAA Ship Okeanos Explorer, ROV Deep Discoverer
  date: 2021-10
  listing: https://www.ncei.noaa.gov/data/oceans/oer/video/EX2107/Video/
  depth: 2
  pattern: "*ROVHD_Low.mp4"
  location:
    kind: noaa-dive
    data: https://oer.hpc.msstate.edu/okeanos/ex2107/
  notes: >-
    Deep-sea coral and sponge habitats off the US southeast; 14 dives, the deepest
    at 3650 m. Pairs with EX1903L2, which worked the same mounds two years earlier:
    the only two cruises here that visited the same place twice.

