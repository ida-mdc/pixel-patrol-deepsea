# ── before the telepresence era ────────────────────────────────────────────────
#
# NOAA's older programmes, digitised from tape. They are here for what nothing
# else in the catalogue has - the Arctic, the Caribbean in 2001, Monterey in 2000,
# a different ship and a different camera every time - and they arrive with less
# metadata than anything else, which is the point rather than a problem.
#
# What is missing, exactly: the filenames carry a date but no time, so there is no
# clock to put a slice on and `recorded_at` is null. The navigation these cruises
# recorded was never published beside the video, so there is no track and no
# position. Every measurement of the footage itself - motion, colour, particles,
# detections - is unaffected, and a report of them is worth having. The widgets
# that need a position or a clock leave these recordings out and say so; they do
# not refuse the rest.
#
# The picture is smaller too: 360x240, digitised from standard-definition tape,
# against 640x360 for the modern proxies. The detector reads it upscaled, which is
# measurably worse - see the README on what a proxy costs - so read a detection
# here as weaker evidence than the same detection on a modern cruise.

- id: HiddenOcean2005L1
  link: https://archive.oceanexplorer.noaa.gov/explorations/05arctic/welcome.html
  name: "Hidden Ocean 2005: Arctic Exploration"
  archive: NOAA Ocean Exploration
  vessel: USCGC Healy
  date: 2005-06
  listing: https://www.ncei.noaa.gov/data/oceans/oer/video/HiddenOcean2005L1/Video/
  depth: 1
  pattern: "*PROXY.MP4"
  notes: >-
    Under the Arctic ice in the Canada Basin - the only polar footage in this
    catalogue, and the only footage taken from an icebreaker. No clock and no
    navigation are published with it.

