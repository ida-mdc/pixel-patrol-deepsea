[project]
name = "pixel-patrol-deepsea"
version = "0.9.0"
description = "PixelPatrol extension for long deep-sea video recordings: motion and animal detection, cached stills, and footage triage widgets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pixel-patrol-base==0.9.1",
    "pixel-patrol-loader-video==0.9.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10.0",              # slice-thumbnail encodes every cached still
    "opencv-python-headless>=4.9",  # letterboxing frames for the detector
    "torch>=2.2",
    # Imported by the YOLOv5 code the detector loads, not by anything here:
    # models/common.py wants `requests`, and utils/plots.py - which it imports on
    # the way to the model - wants `seaborn`. Without them the detector registers,
    # fails on every slice, warns, and writes no detections at all. Declared
    # because "they happened to be in that environment" is how a cluster run came
    # back with 282 recordings and no animals. (`pkg_resources`, which it also
    # imports, is gone from setuptools 81 and is stood in for in `detector`
    # rather than pinning the whole environment backwards for it.)
    "requests>=2.31",
    "seaborn>=0.13",
    "torchvision>=0.17",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling<1.27"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/pixel_patrol_deepsea"]

[project.entry-points."pixel_patrol.processor_plugins"]
deepsea_processors = "pixel_patrol_deepsea.plugin_registry:register_processor_plugins"

[project.entry-points."pixel_patrol.loader_plugins"]
deepsea_loaders = "pixel_patrol_deepsea.plugin_registry:register_loader_plugins"

[project.entry-points."pixel_patrol.viewer_extensions"]
deepsea_viewer = "pixel_patrol_deepsea.plugin_registry:get_viewer_extension_dir"

[tool.uv.sources]
pixel-patrol-base = { path = "../pixel-patrol/packages/pixel-patrol-base" }
pixel-patrol-loader-video = { path = "../pixel-patrol/packages/pixel-patrol-loader-video" }
